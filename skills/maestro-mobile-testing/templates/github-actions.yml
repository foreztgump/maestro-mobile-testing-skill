# Mobile E2E via Maestro Cloud (hosted Android emulators and iOS simulators).
# Copy to .github/workflows/mobile-e2e.yml and adjust the build step for your stack.
# Secrets required: MAESTRO_API_KEY, MAESTRO_PROJECT_ID (any secret names work; the action takes them as inputs).
name: Mobile E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK for the Gradle build; the action installs the Maestro CLI itself.
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      # --- Build an Android binary (React Native / Expo example) ---
      # Swap for your own build (Gradle, EAS, etc.). For iOS, build a
      # Simulator .app, zip it, and pass the zip as app-file.
      - name: Build Android APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease

      - name: Run Maestro Cloud
        id: maestro
        uses: mobile-dev-inc/action-maestro-cloud@v3
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: android/app/build/outputs/apk/release/app-release.apk
          workspace: .maestro
          include-tags: ci
          # device-model / device-os optional — run `maestro list-cloud-devices`
          # device-os: android-34      (android-api-level / ios-version are deprecated)
          # env vars / secrets for flows:
          # env: |
          #   TEST_EMAIL=maestro-ci@example.com

      # Outputs available for later steps / PR comments:
      #   ${{ steps.maestro.outputs.MAESTRO_CLOUD_CONSOLE_URL }}
      #   ${{ steps.maestro.outputs.MAESTRO_CLOUD_FLOW_RESULTS }}
      #   ${{ steps.maestro.outputs.MAESTRO_CLOUD_UPLOAD_STATUS }}
      #   ${{ steps.maestro.outputs.MAESTRO_CLOUD_APP_BINARY_ID }}   (reuse via app-binary-id)
