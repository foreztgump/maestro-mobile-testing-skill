# OTP sign-in flow
#
# Signs in with an emailed one-time code read from Mailpit over HTTP.
# See reference/auth-and-data.md.
#
# Prereqs:
#   - device/emulator with the app installed
#   - Mailpit reachable at EMAIL_SERVICE_URL (MailHog is unmaintained; Mailpit replaces it on the same ports)
#   - backend (or mock) that sends the OTP mail through Mailpit's SMTP port
#   - templates/scripts/ copied next to this flow (runScript paths resolve relative to the flow)
appId: com.example.app
name: Auth - OTP sign in
tags:
  - auth
  - ci
env:
  EMAIL: maestro-auth@example.com
  EMAIL_SERVICE_URL: http://localhost:8025
---
# --- start from a known-clean state (iOS needs clearKeychain too) ---
- launchApp:
    clearState: true
    clearKeychain: true

# --- drop old codes for this address, then request a new one ---
- runScript: scripts/clear-inbox.js
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "send-code-button"
- extendedWaitUntil:
    visible:
      id: "otp-screen"
    timeout: 10000

# --- poll the inbox: up to 10 more checks, ~3 s apart (each wait costs its timeout + ~2 s) ---
- runScript: scripts/fetch-otp.js
- repeat:
    while:
      true: ${output.OTP_CODE == ''}
    times: 10
    commands:
      - extendedWaitUntil:          # Maestro has no sleep; an optional wait for an absent element is the delay
          visible: "__never_present__"
          timeout: 1000
          optional: true
      - runScript: scripts/fetch-otp.js
- assertTrue: ${output.OTP_CODE != ''}

# --- enter each digit (tap each box; auto-focus often steals the cursor) ---
- tapOn: { id: "otp-input-0" }
- inputText: ${output.OTP_CODE[0]}
- tapOn: { id: "otp-input-1" }
- inputText: ${output.OTP_CODE[1]}
- tapOn: { id: "otp-input-2" }
- inputText: ${output.OTP_CODE[2]}
- tapOn: { id: "otp-input-3" }
- inputText: ${output.OTP_CODE[3]}
- tapOn: { id: "otp-input-4" }
- inputText: ${output.OTP_CODE[4]}
- tapOn: { id: "otp-input-5" }
- inputText: ${output.OTP_CODE[5]}

# --- verify signed in ---
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- takeScreenshot: auth-success
